version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns: ['@angular/*', '@angular-*/*']
      nestjs:
        patterns: ['@nestjs/*']
      typeorm:
        patterns: ['typeorm', '@nestjs/typeorm', 'pg']
      nx:
        patterns: ['nx', '@nx/*', '@nrwl/*']
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
