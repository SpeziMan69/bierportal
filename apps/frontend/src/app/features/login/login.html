<div class="auth-page">
  <div class="auth-card">
    <h1 class="auth-title">Log in to WebEng</h1>

    <div class="form-group">
      <label class="form-label">Email or username</label>
      <input
        class="form-input"
        [(ngModel)]="identifier"
        placeholder="Email or username"
        type="text"
      />
    </div>

    <div class="form-group">
      <label class="form-label">Password</label>
      <input
        class="form-input"
        [(ngModel)]="password"
        placeholder="Password"
        type="password"
      />
    </div>

    @if (error()) {
      <p class="error-msg">{{ error() }}</p>
    }

    <button class="btn btn-primary" (click)="submit()">Log In</button>

    <div class="divider">
      <span class="divider-line"></span>
      <span class="divider-text">or</span>
      <span class="divider-line"></span>
    </div>

    <button class="btn btn-social" (click)="auth.loginOrRegisterWithGoogle()">
      <img class="social-icon" src="public/google.ico" alt="Google" />
      Continue with Google
    </button>

    <div class="auth-footer">
      <span class="footer-text">Don't have an account?</span>
      <a class="footer-link" routerLink="/register">Sign up</a>
    </div>
  </div>
</div>
