<form class="overview" (ngSubmit)="save()">
  <h2>Profil bearbeiten</h2>
  <p class="hint">Aktualisiere deinen Benutzernamen und dein Profilbild.</p>

  <div class="preview">
    <div class="preview-avatar">
      @if (picture().trim() && !imageError()) {
        <img [src]="picture().trim() | mediaUrl" alt="Vorschau" (error)="imageError.set(true)" />
      } @else {
        <span>{{ (username || '?').charAt(0).toUpperCase() }}</span>
      }
    </div>
  </div>

  <div class="form-group">
    <label class="form-label" for="username">Benutzername</label>
    <input
      id="username"
      class="form-input"
      name="username"
      type="text"
      [(ngModel)]="username"
      placeholder="Benutzername"
    />
  </div>

  <div class="form-group">
    <span class="form-label">Profilbild ändern</span>
    <label class="btn btn-secondary file-upload" [class.disabled]="uploading()">
      {{ uploading() ? 'Wird hochgeladen …' : 'Bild hochladen' }}
      <input
        name="avatar"
        type="file"
        accept="image/png,image/jpeg,image/webp"
        (change)="onAvatarSelected($event)"
        [disabled]="uploading()"
        hidden
      />
    </label>
  </div>

  @if (error()) {
    <p class="error-msg">{{ error() }}</p>
  }
  @if (success()) {
    <p class="success-msg">Profil erfolgreich gespeichert.</p>
  }

  <button class="btn btn-primary" type="submit" [disabled]="saving()">
    {{ saving() ? 'Wird gespeichert …' : 'Speichern' }}
  </button>
</form>
