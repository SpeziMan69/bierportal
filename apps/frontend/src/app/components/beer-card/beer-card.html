<a
  class="beer-card"
  [routerLink]="['/beers', beer.id]"
  [attr.aria-label]="'Details zu ' + beer.name"
>
  <img
    class="beer-card-image"
    [src]="beer.imageUrl | mediaUrl"
    [alt]="beer.name + ' von ' + beer.brewery"
    loading="lazy"
    (error)="$any($event.target).src = '/public/beer-placeholder.png'"
  />

  <div class="beer-card-content">
    <p class="beer-card-brewery">{{ beer.brewery }}</p>
    <h2>{{ beer.name }}</h2>
    <p>
      {{ beer.type }}
      @if (beer.alcohol !== null) {
        · {{ beer.alcohol }} %
      }
    </p>

    <p>
      @if (beer.rating !== null) {
        {{ beer.rating }}
      } @else {
        Noch nicht bewertet
      }
    </p>
    <span class="beer-card-link">Details ansehen <span aria-hidden="true">→</span></span>
  </div>
</a>
