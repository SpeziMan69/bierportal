<a
  class="panel-dark block min-w-0 flex-1 overflow-hidden p-6 text-inherit no-underline transition hover:border-blue-600 hover:-translate-y-1"
  [routerLink]="['/beers', beer.id]"
  [attr.aria-label]="'Details zu ' + beer.name"
>
  <img
    class="block h-60 w-full rounded-xl object-cover"
    [src]="beer.imageUrl | mediaUrl"
    [alt]="beer.name + ' von ' + beer.brewery"
    loading="lazy"
    (error)="$any($event.target).src = '/public/beer-placeholder.png'"
  />

  <div class="pt-5">
    <p class="font-bold text-blue-600">{{ beer.brewery }}</p>
    <h2>{{ beer.name }}</h2>
    <p>
      {{ beer.type }}
      @if (beer.alcohol !== null) {
        · {{ beer.alcohol }} %
      }
    </p>

    <p>
      @if (beer.rating !== null) {
        {{ beer.rating }}
      } @else {
        Noch nicht bewertet
      }
    </p>
    <span class="mt-4 inline-block font-bold text-blue-600"
      >Details ansehen <span aria-hidden="true">→</span></span
    >
  </div>
</a>
