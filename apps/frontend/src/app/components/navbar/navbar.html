<nav class="navbar">
  <a routerLink="/" class="logo">Bierportal</a>

  <div class="nav-links">
    <a routerLink="/">Home</a>
    <a routerLink="/beers">Biere</a>
    @if (auth.user(); as user) {
      <a routerLink="/profile">Profil</a>
      <span class="nav-user">Angemeldet als {{ user.username }}</span>
      <button type="button" class="logout-btn" (click)="logout()">Abmelden</button>
    } @else {
      <span class="nav-user">Nicht angemeldet</span>
      <a routerLink="/login">Anmelden</a>
      <a routerLink="/register">Registrieren</a>
    }
  </div>
</nav>
