<nav
  class="flex flex-wrap items-center justify-between gap-x-6 gap-y-3 border-b border-neutral-800 bg-neutral-900 px-4 py-4 sm:px-8 lg:h-20 lg:px-12 lg:py-0"
>
  <a routerLink="/" class="text-2xl font-bold text-amber-400 no-underline">Bierportal</a>

  <div class="flex flex-wrap items-center gap-x-4 gap-y-2 sm:gap-x-6">
    <a routerLink="/" class="text-neutral-200 no-underline hover:text-amber-400">Home</a>
    <a routerLink="/beers" class="text-neutral-200 no-underline hover:text-amber-400">Biere</a>
    @if (auth.user(); as user) {
      <a routerLink="/profile" class="text-neutral-200 no-underline hover:text-amber-400">Profil</a>
      <span class="text-neutral-400">Angemeldet als {{ user.username }}</span>
      <button
        type="button"
        class="cursor-pointer border-0 bg-transparent text-neutral-200 hover:text-amber-400"
        (click)="logout()"
      >
        Abmelden
      </button>
    } @else {
      <span class="text-neutral-400">Nicht angemeldet</span>
      <a routerLink="/login" class="text-neutral-200 no-underline hover:text-amber-400">Anmelden</a>
      <a routerLink="/register" class="text-neutral-200 no-underline hover:text-amber-400"
        >Registrieren</a
      >
    }
  </div>
</nav>
